
services:
  nginx-gateway:
    image: nginx:alpine
    # container_name: nginx-gateway
    restart: unless-stopped
    ports:
      - "80:80"     # Đây là cổng DUY NHẤT public ra ngoài cho người dùng
      # - "443:443" # Mở sau này nếu có chứng chỉ SSL (HTTPS)
    volumes:
      - ./nginx-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - backend-ai

  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost/api
        - VITE_BACKEND_URL=http://localhost
    # container_name: frontend-web-service
    restart: unless-stopped
    expose:
      - "80" 
    depends_on:
      - backend

  backend:
      build: 
        context: ./backend-web
      # container_name: backend-node-service
      restart: unless-stopped
      expose:
        - "3000" 
      env_file:
        - ./envs/.env.productionBackendWeb
      depends_on:
        postgres:
          condition: service_started
        rabbitmq:
          condition: service_healthy

  backend-ai:
    build:
      context: ./backend-AI 
      dockerfile: Dockerfile
    # container_name: backend-ai-service
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ./envs/.env.productionBackendAI
    depends_on:
      - backend

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # container_name: postgres-db
    env_file:
      - ./envs/.env.productionPostgres
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:
    image: dpage/pgadmin4:latest
    # container_name: pgadmin-ui
    restart: unless-stopped
    env_file:
      - ./envs/.env.productionPgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json

  rabbitmq:
    image: rabbitmq:3-management
    # container_name: rabbitmq-broker
    restart: unless-stopped
    ports:
      - "15672:15672" # Management UI
    expose:
      - "5672"
    env_file:
      - ./envs/.env.productionRabbit
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  postgres:
  pgadmin:
  rabbitmq: