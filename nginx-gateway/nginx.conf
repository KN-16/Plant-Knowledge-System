worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Cấu hình log để dễ debug
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # Giới hạn kích thước file upload (quan trọng vì bạn có up ảnh)
    client_max_body_size 50M;

    server {
        listen 80;
        server_name localhost; # Đổi thành domain thật khi lên production

        # 1. Route cho AI (Tìm kiếm bằng hình ảnh)
        # Bắt các request bắt đầu bằng /api/ai/
        location /api/ai/ {
            # Tên service trong docker-compose là 'backend-ai', cổng 8000
            proxy_pass http://backend-ai:8000;
            
            # Giữ lại các header quan trọng
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Route cho Node.js Web Backend
        # Bắt các request bắt đầu bằng /api/ (ngoại trừ /api/ai/ đã bị bắt ở trên)
        location /api/ {
            # Tên service trong docker-compose là 'backend', cổng 3000
            proxy_pass http://backend:3000;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Route cho Node.js nhận ảnh tĩnh (Nếu Frontend gọi hiển thị ảnh trực tiếp từ uploads)
        location /uploads/ {
            proxy_pass http://backend:3000;
        }

        # 4. Route cho Frontend (React/Vite)
        # Mọi request khác (không phải API) sẽ vào Frontend (Nginx nội bộ của React)
        location / {
            # Tên service là 'frontend', vì Nginx trong Frontend chạy port 80 nên ta gọi port 80
            proxy_pass http://frontend:80;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Hỗ trợ Websocket (nếu Vite/React có dùng)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}